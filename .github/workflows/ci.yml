name: CI

on:
  pull_request:
  push:
    branches:
      - feature/digital-twin
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/digital-twin/backend/requirements.txt
            training/gru/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install \
            -r apps/digital-twin/backend/requirements.txt \
            -r training/gru/requirements.txt
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q apps/digital-twin/backend src training
          bash -n scripts/run_digital_twin_mac.sh scripts/record_local_activity_clips.sh
      - name: Run backend tests
        env:
          PYTHONPATH: apps/digital-twin/backend
        run: python -m unittest discover -s apps/digital-twin/backend/tests -p 'test_*.py'
      - name: Run training tests and smoke tests
        run: |
          python training/test_splits.py
          python training/stgcn/smoke_test.py
          python training/gru/smoke_test.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/digital-twin/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/digital-twin/frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm run lint
      - name: Build and render-test frontend
        run: pnpm run test
